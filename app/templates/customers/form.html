{% extends "base.html" %}
{% block title %}{{ "Edit Customer" if customer else "Add Customer" }} | Local Shop Billing{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">{{ "Edit Customer" if customer else "Add Customer" }}</h1>
    <a href="{{ url_for('customers.detail', customer_id=customer.id) if customer else url_for('customers.index') }}" class="btn btn-outline-secondary">Cancel</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post" class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="customer-name">Customer Name <span class="text-danger">*</span></label>
                <input
                    id="customer-name"
                    type="text"
                    class="form-control"
                    name="name"
                    value="{{ form_data.name if form_data is defined else (customer.name if customer else '') }}"
                    pattern=".*\S.*"
                    title="Enter a customer name."
                    required
                    autofocus
                >
            </div>
            <div class="col-md-6">
                <label class="form-label" for="customer-contact">Contact <span class="text-danger">*</span></label>
                <input
                    id="customer-contact"
                    type="tel"
                    class="form-control"
                    name="phone"
                    value="{{ form_data.phone if form_data is defined and form_data.phone else (customer.phone if customer and customer.phone else '') }}"
                    pattern="[6-9][0-9]{9}"
                    maxlength="10"
                    inputmode="numeric"
                    title="Enter a valid 10-digit Indian mobile number starting with 6, 7, 8, or 9."
                    required
                >
                <div class="form-text">Enter a 10-digit mobile number</div>
            </div>
            <div class="col-12">
                <label class="form-label" for="customer-address">Address</label>
                <textarea id="customer-address" class="form-control" name="address" rows="3">{{ form_data.address if form_data is defined and form_data.address else (customer.address if customer and customer.address else '') }}</textarea>
            </div>
            <div class="col-12">
                <button class="btn btn-primary">{{ "Save Changes" if customer else "Add Customer" }}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
