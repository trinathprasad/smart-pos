{% extends "base.html" %}
{% block title %}Admin Login | Local Shop Billing{% endblock %}
{% block body_class %}page-login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-sm-10 col-md-6 col-lg-4">
        <div class="card">
            <div class="card-body p-4">
                <h1 class="h4 mb-1 text-primary">Admin Login</h1>
                <p class="text-muted mb-4">Sign in to manage billing, products, reports, and settings.</p>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" autocomplete="current-password" required>
                    </div>
                    <button class="btn btn-primary w-100">Login</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
